<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="aFavGraphite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2E3440" />
      <stop offset="100%" stopColor="#1E2229" />
    </linearGradient>
    <linearGradient id="aFavOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFA726" />
      <stop offset="100%" stopColor="#F57C00" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Graphite Base -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#aFavGraphite)" stroke="url(#aFavOrange)" stroke-width="3.5" />

  <!-- Clean 'A' Monogram Vector -->
  <path d="M 28 74 L 50 24 L 72 74" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Safety Orange Horizontal Bar -->
  <path d="M 37 54 L 63 54" 
        fill="none" 
        stroke="url(#aFavOrange)" 
        stroke-width="6" 
        stroke-linecap="round" />

  <!-- Safety Orange Apex Accent Point -->
  <circle cx="50" cy="18" r="4.5" fill="url(#aFavOrange)" />
</svg>